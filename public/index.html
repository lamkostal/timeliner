<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="google-site-verification" content="3PuiaGPhbFHL7q69kX1NHFjRQek19CWYngIB2otq0X8" />
  <link rel="icon" href="<%= BASE_URL %>favicon.png">
  <title><%= htmlWebpackPlugin.options.title %></title>
  <!-- Primary Meta Tags -->
  <meta name="title" content="Simple timeliner">
  <meta name="description"
    content="With Simple timeliner, a free tool, you can create, edit and save your timelines then download them as an image to use in your documents and/or websites!">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://simpletimeliner.com/">
  <meta property="og:title" content="Simple timeliner">
  <meta property="og:description"
    content="With Simple timeliner, a free tool, you can create, edit and save your timelines then download them as an image to use in your documents and/or websites!">
  <meta property="og:image"
    content="https://metatags.io/assets/meta-tags-16a33a6a8531e519cc0936fbba0ad904e52d35f34a46c97a2c9f6f7dd7d336f2.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://simpletimeliner.com/">
  <meta property="twitter:title" content="Simple timeliner">
  <meta property="twitter:description"
    content="With Simple timeliner, a free tool, you can create, edit and save your timelines then download them as an image to use in your documents and/or websites!">
  <meta property="twitter:image"
    content="https://metatags.io/assets/meta-tags-16a33a6a8531e519cc0936fbba0ad904e52d35f34a46c97a2c9f6f7dd7d336f2.png">
</head>

<body>
  <noscript>
    <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled.
      Please enable it to continue.</strong>
  </noscript>
  <div id="app"></div>
  <!-- built files will be auto injected -->
</body>

</html>
